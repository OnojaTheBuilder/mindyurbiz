<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advertise Your Biz — Mind Your Biz</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="ig-sidebar"><a href="https://instagram.com/evanthebiz" target="_blank">📷 Follow @evanthebiz</a></div>

<header id="hdr" class="solid">
  <div class="wrap nav">
    <a href="index.html" class="brand-mark"><span class="m">Mind Your Biz</span><span class="s">FT. EVAN "THE BIZ"</span></a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="ask-the-biz.html">Ask The Biz</a>
      <a href="book-the-biz.html">Book The Biz</a>
      <a href="consultation-coaching.html">Coaching</a>
      <a href="advertise.html" class="active">Advertise</a>
    </nav>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="wrap">
      <p class="eyebrow">Sponsorship & Ads</p>
      <h1>Advertise <span class="foil">Your Biz</span></h1>
      <p>Reach nearly half a million active viewers across Mind Your Biz platforms.</p>
    </div>
  </section>

  <section class="blk inquiry">
    <div class="wrap">
      <form class="form-grid" action="https://formspree.io/f/mvkgrglk" method="POST">
        <input type="hidden" name="_subject" value="New Advertising Submission">

        <div class="field">
          <label>Name of Business *</label>
          <input type="text" name="business_name" required>
        </div>

        <div class="field">
          <label>Select Advertising Placement Needed *</label>
          <br>
          <label><input type="checkbox" name="ad_type" value="Social Media / Internet Placement"> Social media/internet (nearly half a million viewers on Mind Your Biz platforms)</label><br>
          <label><input type="checkbox" name="ad_type" value="Product Placement"> Product placement</label><br>
          <label><input type="checkbox" name="ad_type" value="Ad Read"> Ad read (customized commercial The Biz)</label><br>
          <label><input type="checkbox" name="ad_type" value="Sponsorship"> Sponsorship (post, segments, events, podcast)</label>
        </div>

        <div class="field">
          <label>Details / Short Summary *</label>
          <textarea name="summary" required></textarea>
        </div>

        <div class="two">
          <div class="field"><label>Phone Number *</label><input type="tel" name="phone" required></div>
          <div class="field"><label>Email Address *</label><input type="email" name="email" required></div>
        </div>

        <button class="btn btn-gold" type="submit">Submit Advertising Request</button>
      </form>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
